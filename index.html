<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AW189 Helicopter Simulation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: monospace;
        }
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 14px;
            line-height: 1.6;
            border: 1px solid #00ff00;
        }
        .hud-item {
            margin-bottom: 5px;
        }
        .status-on {
            color: #00ff00;
            font-weight: bold;
        }
        .status-off {
            color: #ff5555;
            font-weight: bold;
        }
        #fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            z-index: 100;
            user-select: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, opacity 0.2s;
            opacity: 0.8;
        }
        #fullscreen-btn:hover {
            opacity: 1.0;
            transform: scale(1.1);
        }
    </style>
    <!-- Import map for Three.js and addons -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="hud">
        <div class="hud-item">Battery (Q): <span id="hud-battery" class="status-off">OFF</span></div>
        <div class="hud-item">Fuel Pump (F): <span id="hud-fuelpump" class="status-off">OFF</span></div>
        <div class="hud-item">Engine (E): <span id="hud-engine" class="status-off">STOPPED</span></div>
        <div class="hud-item">Fuel Qty: <span id="hud-fuelqty">800</span> kg</div>
        <div class="hud-item">Speed: <span id="hud-speed">0</span> kts</div>
        <div class="hud-item">Weather: <span id="hud-weather">CLEAR</span></div>
    </div>

    <button id="fullscreen-btn" title="Toggle Fullscreen">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 10L3 3"></path>
            <path d="M3 9V3h6"></path>
            <path d="M14 10l7-7"></path>
            <path d="M15 3h6v6"></path>
            <path d="M10 14l-7 7"></path>
            <path d="M3 15v6h6"></path>
            <path d="M14 14l7 7"></path>
            <path d="M21 15v6h-6"></path>
        </svg>
    </button>

    <script>
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.warn(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
            }
        });
    </script>

    <script type="module" src="./main.js"></script>
</body>
</html>
